name: Fluid regime-dependent constitutive operator round24

on:
  push:
    branches:
      - research-fluid-regime-constitutive-round24-20261119
    paths:
      - 'research/fluid_round24/**'
      - '.github/workflows/fluid-round24-regime-constitutive.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/fluid_round24/**'
      - '.github/workflows/fluid-round24-regime-constitutive.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn requests pyarrow tabulate huggingface_hub
      - name: Run regime-dependent constitutive operator research
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python research/fluid_round24/run_regime_constitutive_round24.py 2>&1 | tee fluid-round24.log
      - name: Preserve log on failure
        if: always()
        run: |
          mkdir -p research_outputs/fluid_regime_constitutive_round24
          cp fluid-round24.log research_outputs/fluid_regime_constitutive_round24/run.log || true
      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-regime-constitutive-round24-results
          path: research_outputs/fluid_regime_constitutive_round24
          if-no-files-found: error
          retention-days: 14

name: Fluid parent-orthogonal constitutive round26

on:
  push:
    branches:
      - research-fluid-parent-orthogonal-round26-20261119
    paths:
      - 'research/fluid_round26/**'
      - '.github/workflows/fluid-round26-parent-orthogonal.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'research/fluid_round26/**'
      - '.github/workflows/fluid-round26-parent-orthogonal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn requests pyarrow tabulate huggingface_hub
      - name: Run parent-orthogonal residual constitutive research
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python research/fluid_round26/run_parent_orthogonal_residual_round26.py 2>&1 | tee fluid-round26.log
      - name: Preserve log on failure
        if: always()
        run: |
          mkdir -p research_outputs/fluid_parent_orthogonal_round26
          cp fluid-round26.log research_outputs/fluid_parent_orthogonal_round26/run.log || true
      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-parent-orthogonal-round26-results
          path: research_outputs/fluid_parent_orthogonal_round26
          if-no-files-found: error
          retention-days: 14

name: fluid-network-refined

on:
  push:
    branches:
      - research-fluid-network-refined-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn requests
      - name: Run final refined study
        env:
          PYTHONHASHSEED: '0'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          set -o pipefail
          mkdir -p research_outputs/fluid_network_refined
          python -m py_compile research/fluid_network_refined/run.py
          python research/fluid_network_refined/run.py | tee research_outputs/fluid_network_refined/run.log
          echo '===== SUMMARY ====='
          cat research_outputs/fluid_network_refined/summary.json
          echo '===== FINAL HOLDOUT ====='
          cat research_outputs/fluid_network_refined/final_holdout_results.csv
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-network-refined-evidence
          path: research_outputs/fluid_network_refined
          if-no-files-found: warn
          retention-days: 7

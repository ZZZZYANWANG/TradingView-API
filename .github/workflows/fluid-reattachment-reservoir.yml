name: fluid-reattachment-reservoir

on:
  push:
    branches:
      - research-fluid-reattachment-reservoir-20261118
    paths:
      - research/fluid_reattachment_reservoir/**
      - .github/workflows/fluid-reattachment-reservoir.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-fluid-reattachment-reservoir-20261118
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn requests
      - name: Run low-turnover reattachment reservoir research
        env:
          PYTHONHASHSEED: '0'
        run: |
          mkdir -p research_outputs/fluid_reattachment_reservoir
          python -m py_compile research/fluid_reattachment_reservoir/run.py
          python research/fluid_reattachment_reservoir/run.py | tee research_outputs/fluid_reattachment_reservoir/run.log
      - name: Commit compact evidence to research branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs/fluid_reattachment_reservoir
          git commit -m "research(results): low-turnover reattachment reservoir [skip ci]" || exit 0
          git push origin HEAD:research-fluid-reattachment-reservoir-20261118
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-reattachment-reservoir-evidence
          path: research_outputs/fluid_reattachment_reservoir
          if-no-files-found: warn
          retention-days: 14

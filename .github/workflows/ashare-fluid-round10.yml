name: ashare-fluid-round10
on:
  push:
    branches:
      - research-ashare-fluid-cascade-round10-20261118
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'scikit-learn==1.5.2' 'requests==2.32.3' 'tabulate==0.9.0'
      - name: Run
        env:
          PYTHONHASHSEED: '0'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          mkdir -p research_outputs/ashare_fluid_round10
          python -m py_compile research/ashare_fluid_round10/run.py
          python research/ashare_fluid_round10/run.py 2>&1 | tee research_outputs/ashare_fluid_round10/run.log
      - name: Commit outputs
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research_outputs/ashare_fluid_round10
          git commit -m 'research(temp): record A-share cascade outputs [skip ci]' || exit 0
          git push origin HEAD:research-ashare-fluid-cascade-round10-20261118
      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashare-fluid-round10-evidence
          path: research_outputs/ashare_fluid_round10
          if-no-files-found: warn
          retention-days: 14

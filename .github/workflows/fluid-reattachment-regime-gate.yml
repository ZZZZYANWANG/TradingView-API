name: fluid-reattachment-regime-gate

on:
  push:
    branches:
      - research-fluid-reattachment-regime-gate-20261118
    paths:
      - research/fluid_reattachment_regime_gate/**
      - .github/workflows/fluid-reattachment-regime-gate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-fluid-reattachment-regime-gate-20261118
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn requests
      - name: Build regime-gated experiment
        run: |
          mkdir -p research_outputs/fluid_reattachment_regime_gate
          python research/fluid_reattachment_regime_gate/build.py
          python -m py_compile research/fluid_reattachment_regime_gate/run.py
      - name: Run regime-gated research
        env:
          PYTHONHASHSEED: '0'
        run: |
          set -o pipefail
          python research/fluid_reattachment_regime_gate/run.py | tee research_outputs/fluid_reattachment_regime_gate/run.log
      - name: Commit code and compact evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/fluid_reattachment_regime_gate research_outputs/fluid_reattachment_regime_gate
          git commit -m "research(results): regime-gated reattachment factors [skip ci]" || exit 0
          git push origin HEAD:research-fluid-reattachment-regime-gate-20261118
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-reattachment-regime-gate-evidence
          path: research_outputs/fluid_reattachment_regime_gate
          if-no-files-found: warn
          retention-days: 14

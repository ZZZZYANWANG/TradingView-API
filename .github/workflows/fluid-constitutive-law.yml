name: fluid-constitutive-law

on:
  push:
    branches:
      - research-fluid-constitutive-law-20261118
    paths:
      - research/fluid_constitutive_law/**
      - .github/workflows/fluid-constitutive-law.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-fluid-constitutive-law-20261118
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn requests
      - name: Run constitutive-law research
        env:
          PYTHONHASHSEED: '0'
        run: |
          set -o pipefail
          mkdir -p research_outputs/fluid_constitutive_law
          python -m py_compile research/fluid_constitutive_law/run.py
          python research/fluid_constitutive_law/run.py | tee research_outputs/fluid_constitutive_law/run.log
      - name: Commit compact evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs/fluid_constitutive_law
          git commit -m "research(results): cross-universe constitutive-law factors [skip ci]" || exit 0
          git push origin HEAD:research-fluid-constitutive-law-20261118
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-constitutive-law-evidence
          path: research_outputs/fluid_constitutive_law
          if-no-files-found: warn
          retention-days: 14

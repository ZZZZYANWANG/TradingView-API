name: fluid-stock-graph-compute

on:
  push:
    branches:
      - research-fluid-stock-graph-20261118
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: ${{ !contains(github.event.head_commit.message, '[research-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-fluid-stock-graph-20261118
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn baostock
      - name: Compile and run research
        env:
          PYTHONHASHSEED: '0'
        run: |
          mkdir -p research_outputs/fluid_stock_graph
          python -m py_compile research/fluid_stock_graph/run_research.py
          python research/fluid_stock_graph/run_research.py 2>&1 | tee research_outputs/fluid_stock_graph/run.log
      - name: Commit result evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs/fluid_stock_graph
          if ! git diff --cached --quiet; then
            git commit -m "research-output: fluid stock graph evidence [research-output]"
            git push origin HEAD:research-fluid-stock-graph-20261118
          fi
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-stock-graph-evidence
          path: research_outputs/fluid_stock_graph
          if-no-files-found: warn
          retention-days: 7

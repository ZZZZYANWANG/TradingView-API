name: Fluid Characteristic Wave Round 14 Dispatch

on:
  create:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: github.event_name == 'workflow_dispatch' || (github.event.ref_type == 'branch' && github.event.ref == 'dispatch-fluid-characteristic-wave-round14-event')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-fluid-characteristic-wave-round14-20261119
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn requests pyarrow huggingface-hub tabulate
      - name: Patch inherited round13 compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/fluid_round13/run_baroclinic_torque.py')
          text = path.read_text()
          replacements = {
              'hours = (frame["time"].astype("int64") // 3_600_000_000_000).astype("int64")':
                  'hours = ((frame["time"] - pd.Timestamp("1970-01-01", tz="UTC")) // pd.Timedelta(hours=1)).astype("int64")',
              'flat = pd.DataFrame(values, index=times, columns=SYMBOLS).stack(dropna=False)':
                  'flat = pd.Series(values.reshape(-1), index=index)',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
          text = text.replace('.to_numpy(dtype=float)', '.to_numpy(dtype=float, copy=True)')
          path.write_text(text)
          PY
      - name: Run characteristic-wave research
        shell: bash
        run: |
          set -o pipefail
          rm -rf research_outputs/fluid_characteristic_wave_round14
          mkdir -p research_outputs/fluid_characteristic_wave_round14
          python research/fluid_round14/run_characteristic_wave_action.py 2>&1 | tee research_outputs/fluid_characteristic_wave_round14/run.log
      - name: Commit evidence to isolated research branch
        if: always()
        run: |
          mkdir -p research_outputs/fluid_characteristic_wave_round14
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A research_outputs/fluid_characteristic_wave_round14
          if ! git diff --cached --quiet; then
            git commit -m 'research(temp): record characteristic-wave round14 results'
            git push origin HEAD:research-fluid-characteristic-wave-round14-20261119
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-characteristic-wave-round14-results
          path: research_outputs/fluid_characteristic_wave_round14
          if-no-files-found: warn
          retention-days: 14

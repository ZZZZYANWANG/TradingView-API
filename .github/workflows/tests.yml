name: Stock Reversal Upgrade Existing Runner

on:
  push:
    branches: ["research-stock-reversal-upgrade-20261121"]
  pull_request:
    branches: ["research-stock-reversal-upgrade-20261121"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-reversal-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn requests pyarrow baostock
      - name: Execute upgrade study
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python research/ashare_event_absorption/run_factor_upgrade_entry.py 2>&1 | tee stock_factor_upgrade.log
      - name: Surface decision
        if: always()
        run: |
          if [ -f research_outputs/stock_reversal_upgrade_20261121/decision.json ]; then
            echo 'STOCK_DECISION_BEGIN'
            cat research_outputs/stock_reversal_upgrade_20261121/decision.json
            echo 'STOCK_DECISION_END'
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-reversal-upgrade-20261121
          path: |
            research_outputs/stock_reversal_upgrade_20261121
            stock_factor_upgrade.log
          if-no-files-found: warn
          retention-days: 14

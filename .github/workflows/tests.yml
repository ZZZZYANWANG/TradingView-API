name: Futures Response Upgrade Existing Runner

on:
  push:
    branches: ["research-futures-response-upgrade-20261121"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  futures-response-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn requests pyarrow akshare
      - name: Execute upgrade study
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          python research/fluid_hodge_china_futures/run_factor_upgrade_entry.py 2>&1 | tee futures_factor_upgrade.log
      - name: Surface decision
        if: always()
        run: |
          if [ -f research_outputs/futures_response_upgrade_20261121/decision.json ]; then
            echo 'FUTURES_DECISION_BEGIN'
            cat research_outputs/futures_response_upgrade_20261121/decision.json
            echo 'FUTURES_DECISION_END'
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: futures-response-upgrade-20261121
          path: |
            research_outputs/futures_response_upgrade_20261121
            futures_factor_upgrade.log
          if-no-files-found: warn
          retention-days: 14

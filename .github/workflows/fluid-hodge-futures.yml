name: fluid-hodge-futures-research

on:
  push:
    branches:
      - research-fluid-hodge-futures-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn yfinance pyarrow
      - name: Apply runner compatibility and vectorization patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research/fluid_hodge_futures/run.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('to_numpy(dtype=float)', 'to_numpy(dtype=float, copy=True)')
          start = s.index('def daily_ic_series(')
          end = s.index('\ndef ic_summary(', start)
          replacement = '''def daily_ic_series(factor: pd.DataFrame, target: pd.DataFrame, dates: pd.Index, cols: list[str]) -> pd.Series:
    common_dates = dates.intersection(factor.index).intersection(target.index)
    if len(common_dates) == 0:
        return pd.Series(dtype=float)
    a = factor.loc[common_dates, cols].astype(float)
    b = target.loc[common_dates, cols].astype(float)
    valid = np.isfinite(a) & np.isfinite(b)
    a = a.where(valid)
    b = b.where(valid)
    count = valid.sum(axis=1)
    ar = a.rank(axis=1, method="average")
    br = b.rank(axis=1, method="average")
    ac = ar.sub(ar.mean(axis=1), axis=0)
    bc = br.sub(br.mean(axis=1), axis=0)
    numerator = (ac * bc).sum(axis=1, min_count=1)
    denominator = np.sqrt((ac * ac).sum(axis=1, min_count=1) * (bc * bc).sum(axis=1, min_count=1))
    result = numerator / denominator.replace(0.0, np.nan)
    result = result.where(count >= 6).dropna()
    return result.astype(float).sort_index()

'''
          p.write_text(s[:start] + replacement + s[end + 1:], encoding='utf-8')
          PY
      - name: Compile research program
        run: python -m py_compile research/fluid_hodge_futures/run.py
      - name: Run fluid Hodge futures research
        env:
          PYTHONHASHSEED: '0'
          OUT_DIR: research_outputs/fluid_hodge_futures
        run: |
          mkdir -p research_outputs/fluid_hodge_futures
          set -o pipefail
          python research/fluid_hodge_futures/run.py | tee research_outputs/fluid_hodge_futures/run.log
      - name: Print decision evidence
        if: always()
        run: |
          for f in data_audit.json family_winners.csv validation_results.csv holdout_results.csv selected_factor_spec.json decision.json; do
            if [ -f "research_outputs/fluid_hodge_futures/$f" ]; then
              echo "===== $f ====="
              cat "research_outputs/fluid_hodge_futures/$f"
            fi
          done
      - name: Archive result directory
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          src = Path('research_outputs/fluid_hodge_futures')
          if src.exists():
              shutil.make_archive('fluid-hodge-futures-evidence', 'zip', src)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-hodge-futures-evidence
          path: |
            research_outputs/fluid_hodge_futures
            fluid-hodge-futures-evidence.zip
          if-no-files-found: warn
          retention-days: 7

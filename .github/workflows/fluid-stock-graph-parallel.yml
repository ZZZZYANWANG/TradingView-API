name: fluid-stock-graph-parallel

on:
  push:
    branches:
      - research-fluid-stock-graph-parallel-20261118
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: ${{ !contains(github.event.head_commit.message, '[research-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-fluid-stock-graph-parallel-20261118
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn baostock
      - name: Run parallel A-share fluid graph research
        env:
          PYTHONHASHSEED: '0'
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          mkdir -p research_outputs/fluid_stock_graph_parallel
          python -m py_compile research/fluid_stock_graph/run_research.py research/fluid_stock_graph/run_parallel.py
          python research/fluid_stock_graph/run_parallel.py 2>&1 | tee research_outputs/fluid_stock_graph_parallel/run.log
      - name: Remove raw cache and commit evidence
        if: always()
        run: |
          rm -rf research_outputs/fluid_stock_graph_parallel/cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs/fluid_stock_graph_parallel
          if ! git diff --cached --quiet; then
            git commit -m "research-output: parallel fluid stock graph evidence [research-output]"
            git push origin HEAD:research-fluid-stock-graph-parallel-20261118
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-stock-graph-parallel-evidence
          path: research_outputs/fluid_stock_graph_parallel
          if-no-files-found: warn
          retention-days: 7

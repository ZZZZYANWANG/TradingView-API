name: Fluid Deep Validation

on:
  push:
    branches:
      - research-fluid-deep-validation-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn requests

      - name: Run deep fluid validation
        run: python research/fluid_deep_validation/run.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-deep-validation-results
          path: research_outputs/fluid_deep_validation
          if-no-files-found: warn

name: Fluid Baroclinic Torque Round 13

on:
  push:
    branches:
      - research-fluid-baroclinic-torque-round13-20261119
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn requests pyarrow huggingface-hub tabulate
      - name: Run baroclinic torque research
        run: |
          rm -rf research_outputs/fluid_baroclinic_torque_round13
          mkdir -p research_outputs/fluid_baroclinic_torque_round13
          python research/fluid_round13/run_baroclinic_torque.py 2>&1 | tee research_outputs/fluid_baroclinic_torque_round13/run.log
      - name: Commit evidence
        if: always()
        run: |
          mkdir -p research_outputs/fluid_baroclinic_torque_round13
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A research_outputs/fluid_baroclinic_torque_round13
          if ! git diff --cached --quiet; then
            git commit -m 'research(temp): record baroclinic torque round13 results'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-baroclinic-torque-round13-results
          path: research_outputs/fluid_baroclinic_torque_round13
          if-no-files-found: warn
          retention-days: 14

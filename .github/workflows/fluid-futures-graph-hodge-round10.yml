name: Fluid Futures Graph Hodge Round 10

on:
  push:
    branches:
      - research-fluid-futures-graph-hodge-round10-20261118
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn requests tabulate
      - name: Run futures cross-asset graph Hodge research
        run: |
          rm -rf research_outputs/fluid_futures_graph_hodge_round10
          mkdir -p research_outputs/fluid_futures_graph_hodge_round10
          python research/fluid_round10/run_futures_graph_hodge.py 2>&1 | tee research_outputs/fluid_futures_graph_hodge_round10/run.log
      - name: Commit evidence
        if: always()
        run: |
          mkdir -p research_outputs/fluid_futures_graph_hodge_round10
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A research_outputs/fluid_futures_graph_hodge_round10
          if ! git diff --cached --quiet; then
            git commit -m 'research(temp): record futures graph Hodge evidence'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-futures-graph-hodge-round10-results
          path: research_outputs/fluid_futures_graph_hodge_round10
          if-no-files-found: warn
          retention-days: 14

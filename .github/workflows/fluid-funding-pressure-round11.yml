name: Fluid Funding Pressure Round 11

on:
  push:
    branches:
      - research-fluid-funding-pressure-round11-20261118
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn requests tabulate
      - name: Run funding-premium pressure research
        run: |
          rm -rf research_outputs/fluid_funding_pressure_round11
          mkdir -p research_outputs/fluid_funding_pressure_round11
          python research/fluid_round11/run_funding_pressure.py 2>&1 | tee research_outputs/fluid_funding_pressure_round11/run.log
      - name: Commit evidence
        if: always()
        run: |
          mkdir -p research_outputs/fluid_funding_pressure_round11
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A research_outputs/fluid_funding_pressure_round11
          if ! git diff --cached --quiet; then
            git commit -m 'research(temp): record funding-pressure fluid evidence'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-funding-pressure-round11-results
          path: research_outputs/fluid_funding_pressure_round11
          if-no-files-found: warn
          retention-days: 14

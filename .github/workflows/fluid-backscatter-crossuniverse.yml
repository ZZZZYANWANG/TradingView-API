name: fluid-backscatter-crossuniverse

on:
  push:
    branches:
      - research-fluid-backscatter-crossuniverse-20261118
    paths:
      - research/fluid_backscatter_crossuniverse/**
      - .github/workflows/fluid-backscatter-crossuniverse.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-fluid-backscatter-crossuniverse-20261118
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn requests
      - name: Build replication experiment
        run: |
          mkdir -p research_outputs/fluid_backscatter_crossuniverse
          python research/fluid_backscatter_crossuniverse/build.py
          python -m py_compile research/fluid_backscatter_crossuniverse/run.py
      - name: Run frozen cross-universe replication
        env:
          PYTHONHASHSEED: '0'
        run: |
          set -o pipefail
          python research/fluid_backscatter_crossuniverse/run.py | tee research_outputs/fluid_backscatter_crossuniverse/run.log
      - name: Commit compact evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/fluid_backscatter_crossuniverse research_outputs/fluid_backscatter_crossuniverse
          git commit -m "research(results): cross-universe coherent backscatter [skip ci]" || exit 0
          git push origin HEAD:research-fluid-backscatter-crossuniverse-20261118
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-backscatter-crossuniverse-evidence
          path: research_outputs/fluid_backscatter_crossuniverse
          if-no-files-found: warn
          retention-days: 14

name: Fluid Baroclinic Torque Round 13 Fast

on:
  push:
    branches:
      - research-fluid-baroclinic-torque-round13-fast-20261119
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn requests pyarrow huggingface-hub tabulate
      - name: Run batched baroclinic torque research
        shell: bash
        run: |
          set -o pipefail
          rm -rf research_outputs/fluid_baroclinic_torque_round13_fast
          mkdir -p research_outputs/fluid_baroclinic_torque_round13_fast
          sed -i 's/\.to_numpy(dtype=float)/.to_numpy(dtype=float, copy=True)/' research/fluid_round13/run_baroclinic_torque.py
          python - <<'PY'
          from pathlib import Path
          path = Path('research/fluid_round13/run_baroclinic_torque.py')
          text = path.read_text()
          replacements = {
              'hours = (frame["time"].astype("int64") // 3_600_000_000_000).astype("int64")':
                  'hours = ((frame["time"] - pd.Timestamp("1970-01-01", tz="UTC")) // pd.Timedelta(hours=1)).astype("int64")',
              'flat = pd.DataFrame(values, index=times, columns=SYMBOLS).stack(dropna=False)':
                  'flat = pd.Series(values.reshape(-1), index=index)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'patch expression not found: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          python research/fluid_round13/run_baroclinic_torque_fast.py 2>&1 | tee research_outputs/fluid_baroclinic_torque_round13_fast/run.log
      - name: Commit evidence
        if: always()
        run: |
          mkdir -p research_outputs/fluid_baroclinic_torque_round13_fast
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A research_outputs/fluid_baroclinic_torque_round13_fast
          if ! git diff --cached --quiet; then
            git commit -m 'research(temp): record batched baroclinic torque round13 results'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-baroclinic-torque-round13-fast-results
          path: research_outputs/fluid_baroclinic_torque_round13_fast
          if-no-files-found: warn
          retention-days: 14

name: fluid-stock-data-probe

on:
  push:
    branches:
      - research-fluid-stock-data-probe-20261118
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[probe-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-fluid-stock-data-probe-20261118
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pandas baostock
      - name: Probe BaoStock data coverage
        run: |
          mkdir -p research_outputs/fluid_stock_data_probe
          python - <<'PY' | tee research_outputs/fluid_stock_data_probe/probe.log
          import json, time
          import pandas as pd
          import baostock as bs

          def rows(rs):
              out=[]
              while rs.error_code=='0' and rs.next(): out.append(rs.get_row_data())
              return pd.DataFrame(out, columns=rs.fields)

          receipt={}
          login=bs.login()
          receipt['login']={'code':login.error_code,'msg':login.error_msg}
          try:
              snapshots={}
              for d in ['2017-01-13','2020-01-15','2023-01-13','2026-10-15']:
                  t=time.time(); rs=bs.query_hs300_stocks(date=d); df=rows(rs)
                  snapshots[d]={'error_code':rs.error_code,'error_msg':rs.error_msg,'rows':len(df),'elapsed':time.time()-t,'sample':df.head(3).to_dict('records')}
              receipt['snapshots']=snapshots
              probes=[]
              for code in ['sh.600000','sh.600519','sz.000001']:
                  t=time.time(); rs=bs.query_history_k_data_plus(code,'date,code,open,high,low,close,volume,amount,turn,tradestatus,isST',start_date='2017-01-01',end_date='2026-11-17',frequency='d',adjustflag='2'); ddf=rows(rs); td=time.time()-t
                  t=time.time(); rs2=bs.query_history_k_data_plus(code,'date,time,code,open,high,low,close,volume,amount,adjustflag',start_date='2017-01-01',end_date='2026-11-17',frequency='60',adjustflag='2'); hdf=rows(rs2); th=time.time()-t
                  probes.append({'code':code,'daily_rows':len(ddf),'hourly_rows':len(hdf),'daily_error':[rs.error_code,rs.error_msg],'hourly_error':[rs2.error_code,rs2.error_msg],'daily_elapsed':td,'hourly_elapsed':th,'daily_min':ddf['date'].min() if len(ddf) else None,'daily_max':ddf['date'].max() if len(ddf) else None,'hourly_min':hdf['date'].min() if len(hdf) else None,'hourly_max':hdf['date'].max() if len(hdf) else None,'hourly_times':sorted(hdf['time'].unique().tolist())[:8] if len(hdf) else []})
              receipt['stocks']=probes
          finally:
              bs.logout()
          with open('research_outputs/fluid_stock_data_probe/probe.json','w',encoding='utf-8') as f: json.dump(receipt,f,ensure_ascii=False,indent=2,default=str)
          print(json.dumps(receipt,ensure_ascii=False,indent=2,default=str))
          PY
      - name: Commit probe output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs/fluid_stock_data_probe
          if ! git diff --cached --quiet; then
            git commit -m "probe-output: BaoStock coverage [probe-output]"
            git push origin HEAD:research-fluid-stock-data-probe-20261118
          fi

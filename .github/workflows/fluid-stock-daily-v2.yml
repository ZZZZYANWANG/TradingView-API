name: fluid-stock-daily-v2

on:
  push:
    branches:
      - research-fluid-stock-daily-v2-20261118
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: ${{ !contains(github.event.head_commit.message, '[research-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-fluid-stock-daily-v2-20261118
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn baostock
      - name: Run persistent-session daily research
        env:
          PYTHONHASHSEED: '0'
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          mkdir -p research_outputs/fluid_stock_daily_v2
          python -m py_compile research/fluid_stock_graph/run_research.py research/fluid_stock_graph/run_daily.py research/fluid_stock_graph/run_daily_v2.py
          python research/fluid_stock_graph/run_daily_v2.py 2>&1 | tee research_outputs/fluid_stock_daily_v2/run.log
      - name: Remove cache and commit evidence
        if: always()
        run: |
          rm -rf research_outputs/fluid_stock_daily_v2/cache
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs/fluid_stock_daily_v2
          if ! git diff --cached --quiet; then
            git commit -m "research-output: persistent-session daily fluid graph evidence [research-output]"
            git push origin HEAD:research-fluid-stock-daily-v2-20261118
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-stock-daily-v2-evidence
          path: research_outputs/fluid_stock_daily_v2
          if-no-files-found: warn
          retention-days: 7

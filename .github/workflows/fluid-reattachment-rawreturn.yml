name: fluid-reattachment-rawreturn

on:
  push:
    branches:
      - research-fluid-reattachment-rawreturn-20261118
    paths:
      - .github/workflows/fluid-reattachment-rawreturn.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-fluid-reattachment-rawreturn-20261118
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn requests
      - name: Build raw-return-native experiment
        run: |
          mkdir -p research/fluid_reattachment_rawreturn research_outputs/fluid_reattachment_rawreturn
          cp research/fluid_reattachment_reservoir/run.py research/fluid_reattachment_rawreturn/run.py
          python - <<'PY'
          from pathlib import Path
          p = Path('research/fluid_reattachment_rawreturn/run.py')
          s = p.read_text()
          s = s.replace('research_outputs/fluid_reattachment_reservoir', 'research_outputs/fluid_reattachment_rawreturn')
          s = s.replace('CADENCES = [1, 2, 3, 5]\n', 'CADENCES = [1, 2, 3, 5, 7]\n')
          s = s.replace('issue = issue.where(issue_mask[:, None], 0.0)', 'issue.loc[~issue_mask, :] = 0.0')
          old = '''    labels = {\n        f"y{h}": (np.log(close.shift(-h - 1) / close.shift(-1)) /\n                   (scale * math.sqrt(h) + EPS)).loc[hour0]\n        for h in HORIZONS\n    }'''
          new = '''    labels = {\n        f"y{h}": np.log(close.shift(-h - 1) / close.shift(-1)).loc[hour0]\n        for h in HORIZONS\n    }'''
          if old not in s:
              raise SystemExit('label replacement point not found')
          s = s.replace(old, new)
          s = s.replace('event-reset network-boundary reattachment reservoir sampled once daily', 'event-reset network-boundary reattachment reservoir selected on raw forward returns')
          s = s.replace('cadence chosen by worst preperiod 5bp Sharpe', 'raw-return target; cadence chosen by worst preperiod 5bp Sharpe')
          p.write_text(s)
          PY
          python -m py_compile research/fluid_reattachment_rawreturn/run.py
      - name: Run raw-return-native reservoir research
        env:
          PYTHONHASHSEED: '0'
        run: python research/fluid_reattachment_rawreturn/run.py | tee research_outputs/fluid_reattachment_rawreturn/run.log
      - name: Commit code and compact evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/fluid_reattachment_rawreturn research_outputs/fluid_reattachment_rawreturn
          git commit -m "research(results): raw-return reattachment reservoir [skip ci]" || exit 0
          git push origin HEAD:research-fluid-reattachment-rawreturn-20261118
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-reattachment-rawreturn-evidence
          path: research_outputs/fluid_reattachment_rawreturn
          if-no-files-found: warn
          retention-days: 14

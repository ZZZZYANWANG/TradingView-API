name: Fluid state-dependent memory round20

on:
  push:
    branches:
      - research-fluid-memory-regime-round20-20261119
    paths:
      - 'research/fluid_round20/**'
      - '.github/workflows/fluid-round20-memory-regime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn requests pyarrow tabulate
      - name: Run state-dependent non-Markovian fluid research
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python research/fluid_round20/run_state_dependent_memory_round20.py 2>&1 | tee fluid-round20.log
      - name: Preserve log on failure
        if: always()
        run: |
          mkdir -p research_outputs/fluid_state_dependent_memory_round20
          cp fluid-round20.log research_outputs/fluid_state_dependent_memory_round20/run.log || true
      - name: Upload frozen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-state-dependent-memory-round20-results
          path: research_outputs/fluid_state_dependent_memory_round20
          if-no-files-found: error
          retention-days: 14

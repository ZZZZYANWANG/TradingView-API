name: fluid-stock-graph-fast

on:
  push:
    branches:
      - research-fluid-stock-graph-fast-20261118
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: ${{ !contains(github.event.head_commit.message, '[research-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-fluid-stock-graph-fast-20261118
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy scikit-learn baostock
      - name: Run fast diagnostic panel
        env:
          PYTHONHASHSEED: '0'
        run: |
          mkdir -p research_outputs/fluid_stock_graph_fast
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('fluid_graph', 'research/fluid_stock_graph/run_research.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.MAX_CODES = 80
          module.OUT = Path('research_outputs/fluid_stock_graph_fast')
          module.OUT.mkdir(parents=True, exist_ok=True)
          module.main()
          PY
      - name: Commit result evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs/fluid_stock_graph_fast
          if ! git diff --cached --quiet; then
            git commit -m "research-output: fast fluid stock graph evidence [research-output]"
            git push origin HEAD:research-fluid-stock-graph-fast-20261118
          fi
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-stock-graph-fast-evidence
          path: research_outputs/fluid_stock_graph_fast
          if-no-files-found: warn
          retention-days: 7

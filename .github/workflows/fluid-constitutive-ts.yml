name: fluid-constitutive-ts

on:
  push:
    branches:
      - research-fluid-constitutive-ts-20261118
    paths:
      - research/fluid_constitutive_ts/**
      - .github/workflows/fluid-constitutive-ts.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-fluid-constitutive-ts-20261118
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn requests
      - name: Build time-series experiment
        run: |
          mkdir -p research_outputs/fluid_constitutive_ts
          python research/fluid_constitutive_ts/build.py
          python -m py_compile research/fluid_constitutive_ts/run.py
      - name: Run time-series constitutive research
        env:
          PYTHONHASHSEED: '0'
        run: |
          set -o pipefail
          python research/fluid_constitutive_ts/run.py | tee research_outputs/fluid_constitutive_ts/run.log
      - name: Commit compact evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/fluid_constitutive_ts research_outputs/fluid_constitutive_ts
          git commit -m "research(results): time-series constitutive-law factors [skip ci]" || exit 0
          git push origin HEAD:research-fluid-constitutive-ts-20261118
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fluid-constitutive-ts-evidence
          path: research_outputs/fluid_constitutive_ts
          if-no-files-found: warn
          retention-days: 14

name: ashare-fluid-round10-yahoo
on:
  push:
    branches:
      - research-ashare-fluid-cascade-round10-20261118
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.1.3' 'pandas==2.2.3' 'scikit-learn==1.5.2' 'requests==2.32.3' 'tabulate==0.9.0'
      - name: Run Yahoo replication
        shell: bash
        env:
          PYTHONHASHSEED: '0'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          rm -rf research_outputs/ashare_fluid_round10_yahoo
          mkdir -p research_outputs
          sed -i 's/len(codes) < 100/len(codes) < 60/; s/len(frames) < 80/len(frames) < 60/' research/ashare_fluid_round10/run_yahoo.py
          python -m py_compile research/ashare_fluid_round10/run.py research/ashare_fluid_round10/run_yahoo.py
          python research/ashare_fluid_round10/run_yahoo.py 2>&1 | tee research_outputs/yahoo_run.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashare-fluid-round10-yahoo-evidence
          path: |
            research_outputs/ashare_fluid_round10_yahoo
            research_outputs/yahoo_run.log
          if-no-files-found: warn
          retention-days: 14
